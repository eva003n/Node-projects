<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit convertor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="grid">
    <section>
      <div class="grid">
        <h2>Unit convertor</h2>
        <nav>
          <ul>
            <li><a id="length" class="active" >Length</a></li>
            <li><a id="weigth">Weight</a></li>
            <li><a id="temperature" >Temperature</a></li>
          </ul>
        </nav>
        <form action="" class="grid">
          <div class="grid">
            <label id="measurement"> Enter length to convert </label>
            <input type="text" />
          </div>
          <div class="grid">
            <label> Unit to convert from </label>
            <input type="text" />
          </div>

          <div class="grid">
            <label> Unit to convert from </label>
            <input type="text" />
          </div>

          <div>
            <button>Convert</button>
          </div>
        </form>
      </div>
    </section>

    <script src="index.js"></script>
  </body>
</html>
